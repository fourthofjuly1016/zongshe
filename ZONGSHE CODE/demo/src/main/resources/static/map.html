<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="initial-scale=1.0, user-scalable=no, width=device-width"
    />
    <title>运输调度系统地图</title>
    <style>
      html,
      body,
      #container {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>

    <!-- 引入高德地图 JS API，记得保留你的 key -->
    <script src="https://webapi.amap.com/maps?v=2.0&key=c28ce138979ab3ea24a8427833ba6a0c"></script>

    <script>
      // 1. 初始化地图
      var map = new AMap.Map("container", {
        zoom: 13,
        center: [104.065735, 30.659462],
      });

      // 2. 全局变量，用来存放所有车辆的标记
      var vehicleMarkers = {};

      // 3. 加载 500 个 POI 点位（使用海量点，不卡顿）
      fetch('/api/poi/list')
        .then(res => res.json())
        .then(result => {
          if (result.code !== 0) return;
          var massData = [];
          result.data.forEach(p => {
            if (p.poiLat && p.poiLng) {
              massData.push({
                lnglat: [p.poiLng, p.poiLat],
                name: p.poiName
              });
            }
          });
          var massMarks = new AMap.MassMarks(massData, {
            opacity: 0.8,
            zIndex: 111,
            cursor: 'pointer',
            style: {
              url: 'https://webapi.amap.com/theme/v1.3/markers/n/mark_b.png',
              anchor: new AMap.Pixel(6, 6),
              size: new AMap.Size(19, 31)
            }
          });
          massMarks.setMap(map);
        })
        .catch(err => console.error('点位请求失败:', err));

      // 4. 核心逻辑：拉取车辆并让其平滑移动
      function loadVehicles() {
        fetch('/api/vehicle/list')
          .then(res => res.json())
          .then(result => {
            if (result.code !== 0) return;
            
            // 记录本次请求包含的车辆ID，用来清理消失的车辆
            var currentIds = [];

            result.data.forEach(v => {
              if (v.currentLat && v.currentLng) {
                currentIds.push(v.vehicleId);

                // 如果这辆车是第一次出现，直接创建标记
                if (!vehicleMarkers[v.vehicleId]) {
                  vehicleMarkers[v.vehicleId] = new AMap.Text({
                    text: '车' + v.vehicleId,
                    position: [v.currentLng, v.currentLat],
                    map: map,
                    style: {
                      'background-color': '#1976D2',
                      'color': 'white',
                      'padding': '6px 10px',
                      'border-radius': '4px',
                      'font-size': '13px',
                      'z-index': 999
                    }
                  });
                } else {
                  // 如果已经存在，使用高德官方自带的 moveTo 动画平滑移动过去（耗时 3 秒）
                  var marker = vehicleMarkers[v.vehicleId];
                  
                  // 只有当车在行驶（接单或运货）时，才做平滑动画；装卸货原地不动
                  if (v.vehicleStatus === 'TO_PICKUP' || v.vehicleStatus === 'TRANSPORTING') {
                    marker.moveTo([v.currentLng, v.currentLat], {
                      duration: 3000, 
                      autoRotation: false
                    });
                  } else {
                     // 如果是装货卸货，直接瞬移（其实坐标也没变）
                     marker.setPosition([v.currentLng, v.currentLat]);
                  }
                }
              }
            });

            // 清理已经不存在或失效的车辆
            for (var id in vehicleMarkers) {
              if (!currentIds.includes(parseInt(id))) {
                vehicleMarkers[id].setMap(null);
                delete vehicleMarkers[id];
              }
            }
          })
          .catch(err => console.error('车辆请求失败:', err));
      }

      // 5. 启动定时器：页面打开立刻拉一次，然后每 3 秒拉一次
      loadVehicles();
      setInterval(loadVehicles, 3000);

    </script>
  </body>
</html>
