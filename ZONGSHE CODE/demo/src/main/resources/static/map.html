<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="initial-scale=1.0, user-scalable=no, width=device-width"
    />
    <title>运输调度系统地图</title>
    <style>
      html,
      body,
      #container {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>

    <!-- ★ 引入高德地图 JS API，把 key 换成你自己的 -->
    <script src="https://webapi.amap.com/maps?v=2.0&key=c28ce138979ab3ea24a8427833ba6a0c"></script>

    <!-- ★ 初始化地图 -->
<script>
  // 创建地图实例
  var map = new AMap.Map("container", {
    zoom: 15,
    center: [104.065735, 30.659462]
  });

  // 收集所有标记
  var markers = [];

  // 加"成都"标记
  var chengduMarker = new AMap.Text({
    text: '成都',
    position: [104.065735, 30.659462],
    map: map,
    style: {
      'background-color': 'red',
      'color': 'white',
      'padding': '8px 12px',
      'border-radius': '4px',
      'font-size': '14px'
    }
  });
  markers.push(chengduMarker);   // ★ 把成都也加进数组

  // 从后端拉车辆
  fetch('/api/vehicle/list')
    .then(res => res.json())
    .then(result => {
      if (result.code !== 0) {
        console.error('接口错误:', result.msg);
        return;
      }

      result.data.forEach(v => {
        if (v.currentLat && v.currentLng) {
          var marker = new AMap.Text({
            text: '车' + v.vehicleId,
            position: [v.currentLng, v.currentLat],
            map: map,
            style: {
              'background-color': '#1976D2',
              'color': 'white',
              'padding': '6px 10px',
              'border-radius': '4px',
              'font-size': '13px'
            }
          });
          markers.push(marker);   // ★ 车辆也加进数组
        }
      });

      // ★ 让地图自动显示所有标记
      if (markers.length > 0) {
        map.setFitView(markers);
      }
    })
    .catch(err => console.error('请求失败:', err));
</script>  </body>
</html>
