<!DOCTYPE html>
  var vehicleMarkers = [];   // 用来存所有车辆标记
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="initial-scale=1.0, user-scalable=no, width=device-width"
    />
    <title>运输调度系统地图</title>
    <style>
      html,
      body,
      #container {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>

    <!-- ★ 引入高德地图 JS API，把 key 换成你自己的 -->
    <script src="https://webapi.amap.com/maps?v=2.0&key=c28ce138979ab3ea24a8427833ba6a0c"></script>

    <!-- ★ 初始化地图 -->
<script>
  // 创建地图
var map = new AMap.Map("container", {
  zoom: 15,
  center: [104.065735, 30.659462]
});

// 用于存放所有标记
var markers = [];
var vehicleMarkers = [];   // 只存车辆的，方便定时刷新

// "成都"红标记
var chengduMarker = new AMap.Text({
  text: '成都',
  position: [104.065735, 30.659462],
  map: map,
  style: {
    'background-color': 'red',
    'color': 'white',
    'padding': '8px 12px',
    'border-radius': '4px',
    'font-size': '14px'
  }
});
markers.push(chengduMarker);

// 拉车辆的函数
function loadVehicles() {
  fetch('/api/vehicle/list')
    .then(res => res.json())
    .then(result => {
      if (result.code !== 0) return;

      // 清掉旧的车辆标记
      vehicleMarkers.forEach(m => m.setMap(null));
      vehicleMarkers = [];

      result.data.forEach(v => {
        if (v.currentLat && v.currentLng) {
          var m = new AMap.Text({
            text: '车' + v.vehicleId,
            position: [v.currentLng, v.currentLat],
            map: map,
            style: {
              'background-color': '#1976D2',
              'color': 'white',
              'padding': '6px 10px',
              'border-radius': '4px',
              'font-size': '13px'
            }
          });
          vehicleMarkers.push(m);
        }
      });

      // 自动适配视野
      if (markers.length + vehicleMarkers.length > 0) {
        map.setFitView(markers.concat(vehicleMarkers));
      }
    })
    .catch(err => console.error('车辆请求失败:', err));
}

// 拉点位，用海量点方式绘制（性能好）
fetch('/api/poi/list')
  .then(res => res.json())
  .then(result => {
    if (result.code !== 0) return;

    // 构造海量点数据
    var massData = [];
    result.data.forEach(p => {
      if (p.poiLat && p.poiLng) {
        massData.push({
          lnglat: [p.poiLng, p.poiLat],
          name: p.poiName
        });
      }
    });

    // 用海量点 API 一次性绘制所有 POI
    var massMarks = new AMap.MassMarks(massData, {
      opacity: 0.8,
      zIndex: 111,
      cursor: 'pointer',
      style: {
        url: 'https://webapi.amap.com/theme/v1.3/markers/n/mark_b.png',
        anchor: new AMap.Pixel(6, 6),
        size: new AMap.Size(19, 31)
      }
    });

    massMarks.setMap(map);

    // 点击海量点时弹出名称
    massMarks.on('click', function(e) {
      alert(e.data.name);
    });
  })
  .catch(err => console.error('点位请求失败:', err));

// 首次加载车辆
loadVehicles();

// 每 3 秒刷新车辆位置
setInterval(loadVehicles, 3000);
</script>  </body>
</html>
