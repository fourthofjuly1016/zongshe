spring:
  application:
    name: demo

  datasource:
    # Connector/J expects the Java charset name here; the database itself remains utf8mb4.
    url: jdbc:mysql://localhost:3306/transport_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password:                           # XAMPP 默认 root 无密码，留空即可（注意冒号后有一个空格）
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # SQL schema is managed by 数据库navicat/my-table.sql; validate prevents
      # Hibernate from attempting to recreate existing foreign keys on startup.
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: ${SERVER_PORT:8080}
